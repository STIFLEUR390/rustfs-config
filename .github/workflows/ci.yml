name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install test dependencies
        run: |
          # The runners' apt mirror intermittently fails to resolve. The keyring-backed
          # tests skip themselves when these packages are missing, so this is best effort.
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 &&
            sudo apt-get install -y -o Acquire::http::Timeout=20 gnome-keyring dbus-x11 ||
            echo "keyring packages unavailable"

      - name: Start RustFS
        run: |
          docker compose -f docker-compose.test.yml up -d
          # A bare GET on the API returns 403, so -f would never succeed.
          for i in $(seq 1 300); do
            curl -s http://127.0.0.1:9200/ -o /dev/null && exit 0
            sleep 1
          done
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Tests
        env:
          RUSTFS_TEST_ENDPOINT: http://127.0.0.1:9200
          RUSTFS_TEST_ACCESS_KEY: rustfsadmin
          RUSTFS_TEST_SECRET_KEY: rustfsadmin
        run: |
          cd src-tauri
          if command -v gnome-keyring-daemon >/dev/null && command -v dbus-run-session >/dev/null; then
            dbus-run-session -- bash -c 'echo -n "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; RC_TEST_KEYRING=1 cargo test --no-default-features --all-targets'
          else
            cargo test --no-default-features --all-targets
          fi

      - name: Lint
        run: cd src-tauri && cargo clippy --all-targets --no-default-features -- -D warnings
