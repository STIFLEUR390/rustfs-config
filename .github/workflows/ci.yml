name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install test dependencies
        run: |
          # The runners' apt mirror intermittently fails to resolve (azure.archive.ubuntu.com);
          # retry briefly, then fail loudly rather than build without the keyring stack.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 &&
              sudo apt-get install -y -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
                libdbus-1-dev gnome-keyring dbus-x11; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "apt-get failed after 5 attempts" >&2
          exit 1

      - name: Start RustFS
        run: |
          docker compose -f docker-compose.test.yml up -d
          # A bare GET on the API returns 403, so -f would never succeed.
          for i in $(seq 1 300); do
            curl -s http://127.0.0.1:9200/ -o /dev/null && exit 0
            sleep 1
          done
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Tests
        env:
          RUSTFS_TEST_ENDPOINT: http://127.0.0.1:9200
          RUSTFS_TEST_ACCESS_KEY: rustfsadmin
          RUSTFS_TEST_SECRET_KEY: rustfsadmin
        run: |
          cd src-tauri
          # Headless Secret Service: the daemon must create and unlock a login keyring first,
          # otherwise every keyring call fails with "no result found".
          dbus-run-session -- bash -c '
            if command -v gnome-keyring-daemon >/dev/null; then
              gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "foobar"
              export RC_TEST_KEYRING=1
            fi
            cargo test --no-default-features --all-targets
          '

      - name: Lint
        run: cd src-tauri && cargo clippy --all-targets --no-default-features -- -D warnings
